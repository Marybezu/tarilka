name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Check food database
        run: python3 scripts/check_foods.py

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: "8.14.3"

      # The keystore in the repo is encrypted with a long random passphrase (secret TARILKA_SIGNING_PASS);
      # its own password is a different secret (TARILKA_STORE_PASS). Pull requests never get the key.
      - name: Restore signing key
        if: github.event_name != 'pull_request'
        env:
          PASS: ${{ secrets.TARILKA_SIGNING_PASS }}
          STORE: ${{ secrets.TARILKA_STORE_PASS }}
        run: |
          if [ -n "$PASS" ] && [ -n "$STORE" ]; then
            printf %s "$PASS" > "$RUNNER_TEMP/p"
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -in signing/tarilka.jks.enc -out "$RUNNER_TEMP/tarilka.jks" -pass file:"$RUNNER_TEMP/p"
            rm "$RUNNER_TEMP/p"
            echo "TARILKA_KEYSTORE=$RUNNER_TEMP/tarilka.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Signing secrets are not set; the APK is signed with a temporary key and not published."
          fi

      - name: Test and build
        env:
          VERSION_CODE: ${{ github.run_number }}
          TARILKA_KEYSTORE_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.TARILKA_STORE_PASS || '' }}
          TARILKA_KEY_ALIAS: tarilka
          TARILKA_KEY_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.TARILKA_STORE_PASS || '' }}
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon testReleaseUnitTest assembleRelease 2>&1 | tee build.log

      - name: Remove the decrypted key
        if: always()
        run: rm -f "$RUNNER_TEMP/tarilka.jks"

      - name: Save build log for review
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/log" && cd "$RUNNER_TEMP/log"
          { echo "run ${{ github.run_number }} ${{ job.status }}"; grep -E "^e: |error:|FAILED|What went wrong" -A3 "$GITHUB_WORKSPACE/build.log" | head -300; echo ----; tail -150 "$GITHUB_WORKSPACE/build.log"; } > build.log || true
          find "$GITHUB_WORKSPACE/app/build/test-results" -name "*.xml" -exec cp {} . \; 2>/dev/null || true
          git init -q && git checkout -q -b ci-logs && git add . && git -c user.name=ci -c user.email=ci@localhost commit -qm "build log ${{ github.run_number }}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ci-logs

      - name: Check permissions (no internet allowed)
        run: |
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          "$AAPT" dump permissions app/build/outputs/apk/release/app-release.apk | tee permissions.txt
          if grep -qE "android.permission.(INTERNET|ACCESS_NETWORK_STATE)" permissions.txt; then
            echo "::error::The APK requests network access"; exit 1
          fi

      - name: Name the APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/tarilka-0.1.${{ github.run_number }}.apk"
          ls -la out

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tarilka-apk
          path: out/*.apk

      - name: Publish release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.TARILKA_KEYSTORE != ''
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Tarilka 0.1.${{ github.run_number }}
          files: out/*.apk
          make_latest: true
          body: |
            Завантажте .apk нижче й відкрийте його на телефоні. Відгук або помилка: Опції → Про застосунок → «Написати відгук», або Issues.

            Download the .apk below and open it on your phone. Feedback or a bug: Options → About → Send feedback, or Issues.
