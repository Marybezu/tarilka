name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Check food database
        run: python3 scripts/check_foods.py

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Restore signing key
        env:
          PASS: ${{ secrets.TARILKA_KEY_PASS }}
        run: |
          if [ -n "$PASS" ]; then
            printf %s "$PASS" > "$RUNNER_TEMP/p"
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in signing/tarilka.jks.enc -out "$RUNNER_TEMP/tarilka.jks" -pass file:"$RUNNER_TEMP/p"
            rm "$RUNNER_TEMP/p"
            echo "TARILKA_KEYSTORE=$RUNNER_TEMP/tarilka.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Secret TARILKA_KEY_PASS is not set; the APK is signed with a temporary key."
          fi

      - name: Test and build
        env:
          VERSION_CODE: ${{ github.run_number }}
          TARILKA_KEYSTORE_PASSWORD: ${{ secrets.TARILKA_KEY_PASS }}
          TARILKA_KEY_ALIAS: tarilka
          TARILKA_KEY_PASSWORD: ${{ secrets.TARILKA_KEY_PASS }}
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon testReleaseUnitTest assembleRelease 2>&1 | tee build.log

      - name: Save build log for review
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/log" && cd "$RUNNER_TEMP/log"
          { echo "run ${{ github.run_number }} ${{ job.status }}"; grep -E "^e: |error:|FAILED|What went wrong" -A3 "$GITHUB_WORKSPACE/build.log" | head -300; echo ----; tail -150 "$GITHUB_WORKSPACE/build.log"; } > build.log || true
          find "$GITHUB_WORKSPACE/app/build/test-results" -name "*.xml" -exec cp {} . \; 2>/dev/null || true
          git init -q && git checkout -q -b ci-logs && git add . && git -c user.name=ci -c user.email=ci@localhost commit -qm "build log ${{ github.run_number }}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ci-logs

      - name: Check permissions (no internet allowed)
        run: |
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          "$AAPT" dump permissions app/build/outputs/apk/release/app-release.apk | tee permissions.txt
          if grep -qE "android.permission.(INTERNET|ACCESS_NETWORK_STATE)" permissions.txt; then
            echo "::error::The APK requests network access"; exit 1
          fi

      - name: Name the APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/tarilka-0.1.${{ github.run_number }}.apk"
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: tarilka-apk
          path: out/*.apk

      - name: Publish release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.TARILKA_KEYSTORE != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Tarilka 0.1.${{ github.run_number }}
          files: out/*.apk
          make_latest: true
          body: |
            **Тестова версія.** Завантажте .apk нижче на телефоні й відкрийте його. Перед оновленням зробіть резервну копію: Опції → Дані → Експорт копії.
            Відгук або помилка: Опції → Про застосунок → «Написати відгук», або вкладка Issues.

            **Test version.** Download the .apk below on your phone and open it. Before updating, make a backup: Options → Data → Export backup.
            Feedback or a bug: Options → About → Send feedback, or the Issues tab.
