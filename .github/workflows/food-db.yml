name: Build food database

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/food_sources/**
      - scripts/build_foods.py

permissions:
  contents: write # only to push the result to the foods-generated branch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Download USDA SR Legacy (public domain)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/sr.zip" https://fdc.nal.usda.gov/fdc-datasets/FoodData_Central_sr_legacy_food_csv_2018-04.zip
          sha256sum "$RUNNER_TEMP/sr.zip" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Build foods.csv
        run: |
          python3 scripts/build_foods.py "$RUNNER_TEMP/sr.zip" --report food-report.md || true
          python3 scripts/check_foods.py | tee -a food-report.md || true
          cat food-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Save result for review (branch foods-generated)
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/out" && cp app/src/main/assets/foods.csv food-report.md "$RUNNER_TEMP/out/" && cd "$RUNNER_TEMP/out"
          git init -q && git checkout -q -b foods-generated && git add . && git -c user.name=ci -c user.email=ci@localhost commit -qm "generated foods"
          git push -qf "https://x-access-token:$TOKEN@github.com/${{ github.repository }}" foods-generated
