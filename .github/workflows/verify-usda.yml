name: Verify food data against USDA

on:
  workflow_dispatch:
  push:
    paths:
      - app/src/main/assets/foods.csv
      - scripts/verify_usda.py

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download USDA SR Legacy (public domain)
        run: |
          curl -fsSL -o sr.zip https://fdc.nal.usda.gov/fdc-datasets/FoodData_Central_sr_legacy_food_csv_2018-04.zip
          ls -la sr.zip
      - name: Compare
        run: |
          python3 scripts/verify_usda.py sr.zip | tee usda-report.md
          cat usda-report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: usda-report
          path: usda-report.md
